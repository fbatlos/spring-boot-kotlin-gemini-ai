# Configuración AI Gemini
spring.ai.google.genai.api-key=AQ.Ab8RN6Ir450bdj8InFiz1hbb1uppbJK_fzDb5C2KOkSpOeNOzw
spring.ai.google.genai.chat.options.model=models/gemini-3.8-flash


# Configuración de Base de Datos H2
spring.datasource.url=jdbc:h2:mem:aidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar Consola Web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true